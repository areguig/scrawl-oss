<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comment on a page · Scrawl</title>
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/home.css">
</head>
<body>
<div class="page">
  <nav class="nav">
    <a class="nav-logo" href="/"><span class="nav-mark" aria-hidden="true"></span>Scrawl</a>
  </nav>

  <section class="setup-card report">
    <h1 class="setup-title">Ask for a change</h1>
    <p class="setup-text">Tell the author of this page what to fix or add. Only the author can read comments: their agent picks them up and updates the page at the same link.</p>
    <form id="form" class="report-form">
      <p class="report-pad">Page: <code id="pad"></code></p>
      <label class="report-details">Your comment
        <textarea name="text" rows="6" maxlength="2000" required placeholder="The chart is hard to read on a phone. Drop the third laptop."></textarea>
      </label>
      <button type="submit" class="copy-btn">Send comment</button>
      <p id="status" class="note" role="status"></p>
    </form>
  </section>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const pad = params.get("pad") || "", key = params.get("k");
  const form = document.getElementById("form"), status = document.getElementById("status");
  document.getElementById("pad").textContent = `${pad}.${location.host}`;
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    status.textContent = "Sending...";
    const res = await fetch(`/api/comments${key ? `?k=${encodeURIComponent(key)}` : ""}`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ pad, text: form.elements.text.value }),
    }).catch(() => null);
    if (res && res.ok) {
      form.elements.text.value = "";
      status.textContent = "Sent. The author will see it the next time their agent checks.";
    } else {
      const reasons = { 404: "This page does not exist any more.", 422: "This page has too many comments waiting. Try again later.", 429: "You sent many comments. Try again in an hour." };
      status.textContent = (res && reasons[res.status]) || "The comment could not be sent. Try again later.";
    }
  });
</script>
</body>
</html>
