<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EDIT: table title</title>
  <script src="/scrawl.js"></script>
</head>
<body>
<main class="max-w-5xl mx-auto px-4 py-8 md:py-12 space-y-6">

  <header>
    <p class="text-sm font-semibold text-primary">EDIT: topic · date</p>
    <h1 class="text-3xl md:text-5xl font-bold mt-1">EDIT: table title</h1>
    <p class="text-lg opacity-70 mt-3 max-w-2xl">EDIT: what the rows are. Search, or tap a column to sort.</p>
  </header>

  <!-- EDIT: change only the rows (keep the same keys: name, category, price). Use double quotes, and no apostrophes inside text. To add a column, add a key to every row, one th in the thead and one td in the tbody. -->
  <section class="card bg-base-100"
    x-data='{
      rows: [
        { name: "EDIT: Alpha", category: "Tools", price: 12 },
        { name: "EDIT: Bravo", category: "Games", price: 45 },
        { name: "EDIT: Charlie", category: "Tools", price: 8 },
        { name: "EDIT: Delta", category: "Books", price: 23 }
      ],
      q: "", key: "name", asc: true,
      sort(k) { this.asc = this.key === k ? !this.asc : true; this.key = k },
      get shown() {
        const t = this.q.toLowerCase();
        return this.rows
          .filter(r => Object.values(r).join(" ").toLowerCase().includes(t))
          .sort((a, b) => (a[this.key] > b[this.key] ? 1 : a[this.key] < b[this.key] ? -1 : 0) * (this.asc ? 1 : -1))
      }
    }'>
    <div class="card-body">
      <label class="input input-bordered flex items-center gap-2">
        <i data-lucide="search" class="w-4 h-4 opacity-60"></i>
        <input type="search" class="grow" placeholder="Search rows" x-model="q">
      </label>
      <div class="overflow-x-auto">
        <table class="table">
          <thead>
            <tr>
              <th class="cursor-pointer select-none" @click="sort('name')">Name <span x-show="key === 'name'" x-text="asc ? '↑' : '↓'"></span></th>
              <th class="cursor-pointer select-none" @click="sort('category')">Category <span x-show="key === 'category'" x-text="asc ? '↑' : '↓'"></span></th>
              <th class="cursor-pointer select-none text-right" @click="sort('price')">Price <span x-show="key === 'price'" x-text="asc ? '↑' : '↓'"></span></th>
            </tr>
          </thead>
          <tbody>
            <template x-for="r in shown" :key="r.name">
              <tr class="hover">
                <td class="font-medium" x-text="r.name"></td>
                <td><span class="badge badge-ghost" x-text="r.category"></span></td>
                <td class="text-right" x-text="'$' + r.price"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
      <p class="text-sm opacity-60" x-text="shown.length + ' of ' + rows.length + ' rows'"></p>
    </div>
  </section>

  <footer class="text-sm opacity-60">Source: EDIT where the data comes from, date.</footer>
</main>
</body>
</html>
