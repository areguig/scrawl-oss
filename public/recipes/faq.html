<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EDIT: FAQ title</title>
  <script src="/scrawl.js"></script>
</head>
<body>
<main class="max-w-3xl mx-auto px-4 py-8 md:py-12 space-y-6">

  <header>
    <p class="text-sm font-semibold text-primary">EDIT: topic</p>
    <h1 class="text-3xl md:text-5xl font-bold mt-1">EDIT: the main point as a headline</h1>
    <p class="text-lg opacity-70 mt-3">EDIT: one short sentence. Tap a question to open it.</p>
  </header>

  <!-- EDIT: one details block per question. Summary is the question, the div is the answer (2 to 4 sentences). Add the open attribute to the most important one. -->
  <div class="space-y-3">
    <details open class="collapse collapse-plus bg-base-100 border border-base-300">
      <summary class="collapse-title text-lg font-medium">EDIT: question one</summary>
      <div class="collapse-content"><p>EDIT: the answer.</p></div>
    </details>
    <details class="collapse collapse-plus bg-base-100 border border-base-300">
      <summary class="collapse-title text-lg font-medium">EDIT: question two</summary>
      <div class="collapse-content"><p>EDIT: the answer.</p></div>
    </details>
    <details class="collapse collapse-plus bg-base-100 border border-base-300">
      <summary class="collapse-title text-lg font-medium">EDIT: question three</summary>
      <div class="collapse-content"><p>EDIT: the answer.</p></div>
    </details>
    <details class="collapse collapse-plus bg-base-100 border border-base-300">
      <summary class="collapse-title text-lg font-medium">EDIT: question four</summary>
      <div class="collapse-content"><p>EDIT: the answer.</p></div>
    </details>
  </div>

  <footer class="text-sm opacity-60">Source: EDIT where, date.</footer>
</main>
</body>
</html>
