      <!-- EDIT: the diagram below is Mermaid syntax. Keep flowchart TD (top down) or use LR (left to right). One link per line. Node text goes in brackets: A[Text], decisions in braces: B{Question?}. Link labels go between pipes after the arrow. No quotes or parentheses inside node text. -->
      <div class="overflow-x-auto">
        <pre class="mermaid flex justify-center">
flowchart TD
  A[EDIT: Start] --> B{EDIT: Question?}
  B -->|Yes| C[EDIT: Do this]
  B -->|No| D[EDIT: Do that]
  C --> E[EDIT: Done]
  D --> E
        </pre>
      </div>
    </div>
  </section>

  <footer class="text-sm opacity-60">Source: EDIT where this comes from, date.</footer>

<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
