<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EDIT: calculator title</title>
  <script src="/scrawl.js"></script>
</head>
<body>
<main class="max-w-5xl mx-auto px-4 py-8 md:py-12 space-y-6">

  <header>
    <p class="text-sm font-semibold text-primary">EDIT: topic</p>
    <h1 class="text-3xl md:text-5xl font-bold mt-1">EDIT: calculator title</h1>
    <p class="text-lg opacity-70 mt-3 max-w-2xl">EDIT: what it computes. The result updates as you type.</p>
  </header>

  <!-- EDIT: the starting values live in x-data. Every input uses x-model.number with the same name. The formulas are in the x-text of the stats below (loan payment example). -->
  <div x-data="{ amount: 20000, rate: 4.5, years: 5 }" class="grid gap-6 md:grid-cols-2">

    <section class="card bg-base-100">
      <div class="card-body gap-4">
        <h2 class="card-title">Inputs</h2>
        <label class="form-control">
          <span class="label-text mb-1">EDIT: Amount (EUR)</span>
          <input type="number" inputmode="decimal" class="input input-bordered" x-model.number="amount">
        </label>
        <label class="form-control">
          <span class="label-text mb-1">EDIT: Yearly rate (%)</span>
          <input type="number" inputmode="decimal" step="0.1" class="input input-bordered" x-model.number="rate">
        </label>
        <label class="form-control">
          <span class="label-text mb-1">EDIT: Years</span>
          <input type="number" inputmode="numeric" class="input input-bordered" x-model.number="years">
        </label>
      </div>
    </section>

    <!-- EDIT: one .stat per result; the formula goes in x-text. toFixed(2) keeps 2 decimals. -->
    <div class="stats stats-vertical w-full bg-base-100 border border-base-300">
      <div class="stat">
        <div class="stat-title">Monthly payment</div>
        <div class="stat-value text-primary" x-text="(rate ? amount * (rate/1200) / (1 - Math.pow(1 + rate/1200, -years*12)) : amount / (years*12)).toFixed(2)"></div>
        <div class="stat-desc">EDIT: per month</div>
      </div>
      <div class="stat">
        <div class="stat-title">Total cost</div>
        <div class="stat-value" x-text="((rate ? amount * (rate/1200) / (1 - Math.pow(1 + rate/1200, -years*12)) : amount / (years*12)) * years * 12).toFixed(2)"></div>
        <div class="stat-desc">EDIT: over the whole term</div>
      </div>
      <div class="stat">
        <div class="stat-title">Interest paid</div>
        <div class="stat-value" x-text="((rate ? amount * (rate/1200) / (1 - Math.pow(1 + rate/1200, -years*12)) : amount / (years*12)) * years * 12 - amount).toFixed(2)"></div>
        <div class="stat-desc">EDIT: total minus amount</div>
      </div>
    </div>
  </div>

  <footer class="text-sm opacity-60">Source: EDIT assumptions, for example fixed rate, no fees.</footer>
</main>
</body>
</html>
