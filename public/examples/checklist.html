<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weekend ski trip packing list</title>
  <script src="/scrawl.js"></script>
</head>
<body>
<main class="max-w-3xl mx-auto px-4 py-8 md:py-12 space-y-6">

  <header>
    <p class="text-sm font-semibold text-primary">Weekend ski trip · 2 nights</p>
    <h1 class="text-3xl md:text-5xl font-bold mt-1">12 things to pack for a weekend on the slopes</h1>
    <p class="text-lg opacity-70 mt-3">Tick items off as they go in the bag. Ticks are saved in this browser.</p>
  </header>

  <section class="card bg-base-100"
    x-data='{
      items: $persist([
        { text: "Ski jacket and pants", done: false },
        { text: "Base layers, 2 sets", done: false },
        { text: "Waterproof gloves", done: false },
        { text: "Warm hat and neck gaiter", done: false },
        { text: "Goggles and sunglasses", done: false },
        { text: "Helmet", done: false },
        { text: "Ski socks, 3 pairs", done: false },
        { text: "Sunscreen and lip balm", done: false },
        { text: "Lift pass and ID", done: false },
        { text: "Phone charger and power bank", done: false },
        { text: "Water bottle and snacks", done: false },
        { text: "Casual clothes for the evening", done: false }
      ]).as("ski-weekend"),
      get done() { return this.items.filter(i => i.done).length }
    }'>
    <div class="card-body gap-4">
      <div class="flex items-center justify-between gap-3">
        <p class="font-semibold" x-text="done + ' of ' + items.length + ' packed'"></p>
        <button class="btn btn-ghost btn-sm" @click="items.forEach(i => i.done = false)">Reset</button>
      </div>
      <progress class="progress progress-primary w-full" value="0" :value="done" :max="items.length"></progress>
      <ul class="divide-y divide-base-300">
        <template x-for="item in items" :key="item.text">
          <li>
            <label class="flex items-center gap-3 py-3 cursor-pointer">
              <input type="checkbox" class="checkbox checkbox-primary" x-model="item.done">
              <span class="flex-1" :class="item.done && 'line-through opacity-50'" x-text="item.text"></span>
            </label>
          </li>
        </template>
      </ul>
    </div>
  </section>

  <footer class="text-sm opacity-60">Source: sample list invented for this page, October 2026. Rent skis and boots at the resort to save space.</footer>
</main>
</body>
</html>
