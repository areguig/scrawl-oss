<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Loop Hop: a one-thumb arcade game. Tap to hop between two orbits, dodge spikes, chain sparks.">
<title>Loop Hop: one-thumb orbit arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#0b0820;color:#fff;
    font-family:Fredoka,system-ui,-apple-system,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #app{position:relative;height:100vh;height:100svh;overflow:hidden;touch-action:none}
  canvas{position:absolute;inset:0;display:block}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    padding:0 24px calc(env(safe-area-inset-bottom) + 9vh);box-sizing:border-box;text-align:center;pointer-events:none;
    transition:opacity .35s ease, transform .35s ease}
  .ov.hide{opacity:0;transform:translateY(16px)}
  h1{margin:0;font-size:clamp(44px,13vw,72px);line-height:1;letter-spacing:1px;
    background:linear-gradient(90deg,#6ef3ff,#c58bff,#ff6b9a);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 18px rgba(160,110,255,.45))}
  .tag{margin:12px 0 0;font-size:17px;opacity:.8;max-width:320px;line-height:1.35;font-weight:500}
  .best{margin-top:14px;font-size:16px;opacity:.75;font-weight:500}
  .cta{margin-top:22px;font-size:22px;font-weight:700;letter-spacing:2px;animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.96)}}
  .big{font-size:clamp(72px,24vw,120px);font-weight:700;line-height:1;margin:4px 0}
  .lbl{font-size:16px;letter-spacing:3px;opacity:.7;font-weight:500}
  .nb{display:inline-block;margin-top:8px;padding:6px 14px;border-radius:999px;font-weight:700;font-size:16px;letter-spacing:1px;
    background:linear-gradient(90deg,#ffd84d,#ff8a4d);color:#2a1300;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
  #mute{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:10px;width:48px;height:48px;border-radius:50%;
    border:0;background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;cursor:pointer;z-index:5}
  #mute svg{width:24px;height:24px}
  @media (prefers-reduced-motion: reduce){.cta,.nb{animation:none}}
</style>
</head>
<body>
<div id="app">
<canvas id="c"></canvas>

<div id="menu" class="ov">
  <h1>Loop Hop</h1>
  <p class="tag">Tap anywhere to hop between orbits. Dodge the spikes, chain the sparks, skim close for bonus.</p>
  <div class="best" id="menuBest"></div>
  <div class="cta">TAP TO PLAY</div>
</div>

<div id="over" class="ov hide">
  <div class="lbl">SCORE</div>
  <div class="big" id="final">0</div>
  <div id="nbWrap"></div>
  <div class="best" id="overBest"></div>
  <div class="cta" id="retry" style="visibility:hidden">TAP TO RETRY</div>
</div>

<button id="mute" aria-label="Sound on or off"></button>
</div>

<script>
(() => {
const TAU = Math.PI * 2;
const app = document.getElementById('app'), cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = {
  get(k, d) { try { const v = localStorage.getItem('loophop.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('loophop.' + k, JSON.stringify(v)); } catch {} }
};

// ---------- Layout ----------
let W, H, cx, cy, RO, RI;
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  W = app.clientWidth; H = app.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  RO = Math.min(W * 0.42, H * 0.29, 230);
  RI = RO * 0.6;
  cx = W / 2; cy = H * 0.47;
  bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.8);
  bgGrad.addColorStop(0, '#22134a'); bgGrad.addColorStop(1, '#0b0820');
}
let bgGrad;
addEventListener('resize', resize); resize();
const ringR = f => RI + (RO - RI) * f;

// ---------- Glow sprites ----------
const glowCache = {};
function glow(color) {
  if (glowCache[color]) return glowCache[color];
  const s = 64, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d'), gr = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  gr.addColorStop(0, color); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
  return glowCache[color] = c;
}
function drawGlow(color, x, y, r, a = 1) {
  ctx.globalAlpha = a; ctx.drawImage(glow(color), x - r, y - r, r * 2, r * 2); ctx.globalAlpha = 1;
}

// ---------- Audio ----------
let ac, master, muted = store.get('muted', false);
function audio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC();
    const comp = ac.createDynamicsCompressor();
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.55;
    master.connect(comp).connect(ac.destination);
  }
  if (ac.state === 'suspended') ac.resume();
}
function tone(f, dur, type = 'sine', vol = 0.25, to = null, delay = 0) {
  if (!ac || muted) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol = 0.3, freq = 1200) {
  if (!ac || muted) return;
  const n = Math.floor(ac.sampleRate * dur), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = b; f.type = 'lowpass'; f.frequency.value = freq;
  f.frequency.exponentialRampToValueAtTime(80, ac.currentTime + dur);
  g.gain.value = vol; s.connect(f).connect(g).connect(master); s.start();
}
const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];
const note = i => 523.25 * Math.pow(2, SCALE[Math.min(i, SCALE.length - 1)] / 12);
const sfx = {
  hop: up => tone(up ? 420 : 300, 0.09, 'sine', 0.18, up ? 640 : 200),
  pass: () => tone(1500, 0.03, 'square', 0.03),
  gem: c => { tone(note(c), 0.16, 'triangle', 0.28); tone(note(c) * 2, 0.1, 'sine', 0.08, null, 0.03); },
  close: () => { tone(880, 0.07, 'square', 0.08); tone(1320, 0.1, 'square', 0.08, null, 0.06); },
  level: () => [0, 4, 7, 12].forEach((s, i) => tone(392 * Math.pow(2, s / 12), 0.14, 'triangle', 0.2, null, i * 0.07)),
  die: () => { noise(0.5, 0.5, 2500); tone(220, 0.55, 'sawtooth', 0.22, 40); },
  best: () => [0, 4, 7, 12, 16].forEach((s, i) => tone(523 * Math.pow(2, s / 12), 0.18, 'triangle', 0.18, null, 0.25 + i * 0.09)),
};
const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>';
const muteBtn = $('mute');
const paintMute = () => muteBtn.innerHTML = muted ? ICON_OFF : ICON_ON;
paintMute();
muteBtn.addEventListener('pointerdown', e => {
  e.stopPropagation(); e.preventDefault();
  muted = !muted; store.set('muted', muted); audio();
  if (master) master.gain.value = muted ? 0 : 0.55;
  paintMute(); if (!muted) tone(660, 0.08, 'sine', 0.2);
});

// ---------- State ----------
let state = 'menu', time = 0, best = store.get('best', 0);
let P, obs, parts, texts, trail, score, passed, combo, nextA, hue, level, shake, flash, timeScale, deadAt, scoreBump, ringPulse;
const stars = Array.from({ length: 60 }, () => ({ a: Math.random() * TAU, d: Math.random(), s: Math.random() * 1.6 + 0.4, tw: Math.random() * TAU }));

function reset() {
  P = { a: -Math.PI / 2, from: 0, to: 0, ht: 1, f: 0, sq: 0 };
  obs = []; parts = []; texts = []; trail = [];
  score = 0; passed = 0; combo = 0; level = 0; hue = 190;
  nextA = P.a + 2.2; shake = 0; flash = 0; timeScale = 1; scoreBump = 0; ringPulse = 0;
}
reset();
$('menuBest').textContent = best ? 'Best: ' + best : '';

const omega = () => 1.75 + 1.7 * (1 - Math.exp(-passed / 38));
const PR = () => RO * 0.058, OS = () => RO * 0.062, GS = () => RO * 0.05;
const pos = (a, f) => { const r = ringR(f); return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; };

// ---------- Patterns ----------
function add(k, a, f, extra = {}) { obs.push({ k, a, f, born: time, passed: false, minD: 1e9, ...extra }); }
function makePattern(a) {
  const w = omega(), r = Math.random(), ring = Math.random() < 0.5 ? 0 : 1;
  const zig = 0.42 + w * 0.17;
  const gap = 0.55 + w * 0.12 + Math.max(0, 0.35 - passed * 0.01);
  if (passed >= 14 && r < 0.17) {
    add('mover', a, 0.5, { ph: Math.random() * TAU, sp: 2.2 + Math.random() * 0.8 });
    return a + gap + 0.35;
  }
  if (passed >= 5 && r < 0.47) {
    const n = 2 + (passed > 18 ? Math.floor(Math.random() * 2) : 0) + (passed > 40 && Math.random() < 0.3 ? 1 : 0);
    for (let i = 0; i < n; i++) add('spike', a + i * zig, (ring + i) % 2);
    if (Math.random() < 0.5) add('gem', a + zig * 0.5, ring);
    return a + (n - 1) * zig + gap;
  }
  if (r < 0.75) {
    add('spike', a, ring);
    if (Math.random() < 0.55) add('gem', a + zig * 0.85, ring); // risky reward: hop back fast
    return a + gap;
  }
  // gem corridor: sparks on one ring, spike blocks the other
  for (let i = 0; i < 3; i++) add('gem', a + i * 0.17, ring);
  add('spike', a + 0.17, 1 - ring);
  return a + 0.34 + gap;
}

// ---------- FX ----------
function burst(x, y, color, n, spd = 260, size = 4) {
  if (reduced) n = Math.ceil(n / 2);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, v = spd * (0.3 + Math.random() * 0.9);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, decay: 1.2 + Math.random() * 1.4, size: size * (0.5 + Math.random()), color });
  }
}
function floatText(x, y, txt, color, size = 22) { texts.push({ x, y, txt, color, size, life: 1 }); }
function addShake(v) { if (!reduced) shake = Math.max(shake, v); }

// ---------- Input ----------
function hop() {
  P.from = P.f; P.to = P.to ? 0 : 1; P.ht = 0;
  sfx.hop(P.to === 1);
  const [x, y] = pos(P.a, P.f);
  burst(x, y, 'rgba(140,240,255,1)', 5, 120, 2.5);
}
function start() {
  reset(); state = 'play';
  $('menu').classList.add('hide'); $('over').classList.add('hide');
  tone(523, 0.08, 'triangle', 0.2); tone(784, 0.12, 'triangle', 0.2, null, 0.07);
}
function input() {
  audio();
  if (state === 'menu') start();
  else if (state === 'play') hop();
  else if (state === 'over' && time - deadAt > 1.3) start();
}
app.addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('a,button,input,textarea')) return; // keep host links usable
  e.preventDefault(); input();
}, { passive: false });
addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp' || e.code === 'ArrowDown') { e.preventDefault(); if (!e.repeat) input(); } });
addEventListener('contextmenu', e => e.preventDefault());

// ---------- Game events ----------
function addScore(n, x, y, color) {
  score += n; scoreBump = 1;
  if (x !== undefined) floatText(x, y, '+' + n, color);
}
function die(o) {
  state = 'dying'; deadAt = time;
  const [x, y] = pos(P.a, P.f);
  burst(x, y, '#ffffff', 26, 380, 5);
  burst(x, y, 'hsl(350,95%,65%)', 22, 300, 5);
  burst(x, y, 'hsl(' + hue + ',90%,65%)', 18, 200, 3);
  addShake(22); flash = 0.75; timeScale = 0.15;
  sfx.die();
  if (navigator.vibrate) navigator.vibrate([60, 40, 90]);
  o.hit = true;
}
function gameOver() {
  state = 'over';
  const isBest = score > best;
  if (isBest) { best = score; store.set('best', best); sfx.best(); }
  $('final').textContent = score;
  $('nbWrap').innerHTML = isBest && score > 0 ? '<span class="nb">NEW BEST!</span>' : '';
  $('overBest').textContent = 'Best: ' + best;
  $('menuBest').textContent = 'Best: ' + best;
  $('retry').style.visibility = 'hidden';
  $('over').classList.remove('hide');
}

// ---------- Update ----------
function update(dt) {
  time += dt;
  timeScale += (1 - timeScale) * Math.min(1, dt * (state === 'dying' ? 1.2 : 4));
  const t = dt * (state === 'dying' ? timeScale : 1);

  if (state === 'menu') P.a += 1.1 * dt;
  if (state === 'play') {
    const w = omega();
    P.a += w * t;
    // hop easing
    if (P.ht < 1) { P.ht = Math.min(1, P.ht + t / 0.11); }
    const e = 1 - Math.pow(1 - P.ht, 3);
    P.f = P.from + (P.to - P.from) * e;
    P.sq = P.ht < 1 ? Math.sin(P.ht * Math.PI) : P.sq * 0.85;

    while (nextA < P.a + TAU * 0.6) nextA = makePattern(nextA);

    const [px, py] = pos(P.a, P.f), pr = PR();
    for (const o of obs) {
      if (o.k === 'mover') o.f = 0.5 + 0.5 * Math.sin(o.ph + time * o.sp);
      if (o.gone) continue;
      const [ox, oy] = pos(o.a, o.f), d = Math.hypot(px - ox, py - oy);
      if (o.k === 'gem') {
        if (d < pr + GS() * 1.5) {
          o.gone = true; combo++;
          const pts = Math.min(combo, 5);
          addScore(pts, ox, oy - 14, 'hsl(48,100%,65%)');
          sfx.gem(combo - 1);
          burst(ox, oy, 'hsl(48,100%,62%)', 14, 200, 3.5);
          if (combo >= 3) floatText(cx, cy + 6, 'x' + pts + ' CHAIN', 'hsl(48,100%,70%)', 18 + Math.min(combo, 8) * 2);
        } else if (!o.passed && o.a < P.a - 0.25) {
          o.passed = true;
          if (combo >= 2) floatText(px, py - 20, 'chain lost', 'rgba(255,255,255,.6)', 15);
          combo = 0;
        }
        continue;
      }
      const hitR = (pr + OS()) * 0.8;
      if (d < hitR) { die(o); break; }
      o.minD = Math.min(o.minD, d);
      if (!o.passed && o.a < P.a - 0.2) {
        o.passed = true; passed++;
        if (o.minD < (pr + OS()) * 1.45) {
          addScore(2, px, py - 22, 'hsl(180,100%,70%)');
          floatText(px, py - 46, 'CLOSE!', 'hsl(180,100%,75%)', 20);
          sfx.close(); addShake(4);
        } else { addScore(1); sfx.pass(); }
        if (passed % 10 === 0) {
          level++; hue = (190 + level * 47) % 360; ringPulse = 1;
          floatText(cx, cy - 18, 'FASTER', '#fff', 30);
          sfx.level(); addShake(6);
        }
      }
    }
    obs = obs.filter(o => o.a > P.a - 1.0);
    trail.push([px, py]); if (trail.length > 18) trail.shift();
  } else if (state === 'dying') {
    if (time - deadAt > 1.0) gameOver();
  } else if (state === 'over') {
    if (time - deadAt > 1.3) $('retry').style.visibility = 'visible';
  }
  if (state !== 'play' && trail.length) trail.shift();

  for (const p of parts) { p.x += p.vx * t; p.y += p.vy * t; p.vx *= Math.pow(0.04, t); p.vy *= Math.pow(0.04, t); p.life -= p.decay * t; }
  parts = parts.filter(p => p.life > 0);
  for (const x of texts) { x.y -= 40 * dt; x.life -= dt * 1.1; }
  texts = texts.filter(x => x.life > 0);
  shake *= Math.pow(0.002, dt); flash *= Math.pow(0.01, dt);
  scoreBump *= Math.pow(0.001, dt); ringPulse *= Math.pow(0.05, dt);
}

// ---------- Draw ----------
function diamond(x, y, s, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(s, 0); ctx.lineTo(0, s); ctx.lineTo(-s, 0); ctx.closePath();
  ctx.restore();
}
function spikeShape(x, y, s, a, spin) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a + spin);
  ctx.beginPath();
  for (let i = 0; i < 12; i++) {
    const r = i % 2 ? s * 0.55 : s * 1.15, ang = i / 12 * TAU;
    ctx[i ? 'lineTo' : 'moveTo'](Math.cos(ang) * r, Math.sin(ang) * r);
  }
  ctx.closePath(); ctx.restore();
}
const easeBack = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

function draw() {
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  // stars drifting around the center
  const spin = P.a * 0.06, maxD = Math.hypot(W, H) * 0.6;
  for (const s of stars) {
    const a = s.a - spin * (0.4 + s.d), d = 30 + s.d * maxD;
    const x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d;
    ctx.globalAlpha = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(time * 2 + s.tw));
    ctx.fillStyle = '#cbbcff'; ctx.fillRect(x, y, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  // rings
  const rc = 'hsl(' + hue + ',90%,66%)';
  for (const f of [0, 1]) {
    const r = ringR(f);
    ctx.strokeStyle = 'hsla(' + hue + ',90%,66%,0.13)'; ctx.lineWidth = 12 + ringPulse * 20;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
    ctx.strokeStyle = rc; ctx.globalAlpha = 0.55 + ringPulse * 0.45; ctx.lineWidth = 2.5 + ringPulse * 3;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1;
  }
  // center core
  drawGlow('hsla(' + hue + ',90%,60%,0.5)', cx, cy, RI * 0.55 * (1 + ringPulse * 0.4));

  // obstacles
  for (const o of obs) {
    if (o.gone) continue;
    const sc = easeBack(Math.min(1, (time - o.born) / 0.35));
    const [x, y] = pos(o.a, o.f);
    const fade = Math.max(0, Math.min(1, (o.a - (P.a - 1.0)) / 0.4));
    ctx.globalAlpha = fade;
    if (o.k === 'gem') {
      const bob = Math.sin(time * 5 + o.a * 3) * 2;
      drawGlow('rgba(255,210,70,0.75)', x, y + bob, GS() * 3.2 * sc, fade);
      ctx.globalAlpha = fade;
      diamond(x, y + bob, GS() * sc, time * 2.5 + o.a);
      ctx.fillStyle = 'hsl(48,100%,64%)'; ctx.fill();
      diamond(x - GS() * 0.2, y + bob - GS() * 0.2, GS() * 0.35 * sc, time * 2.5);
      ctx.fillStyle = '#fff8d6'; ctx.fill();
    } else {
      if (o.k === 'mover') {
        const [x0, y0] = pos(o.a, 0), [x1, y1] = pos(o.a, 1);
        ctx.strokeStyle = 'rgba(255,90,200,0.35)'; ctx.lineWidth = 2; ctx.setLineDash([4, 6]);
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.setLineDash([]);
      }
      const col = o.k === 'mover' ? 'hsl(310,95%,65%)' : 'hsl(350,95%,62%)';
      const danger = 1 + 0.08 * Math.sin(time * 12 + o.a * 5);
      drawGlow(o.k === 'mover' ? 'rgba(255,80,220,0.6)' : 'rgba(255,70,110,0.6)', x, y, OS() * 2.8 * sc, fade);
      ctx.globalAlpha = fade;
      spikeShape(x, y, OS() * sc * danger, o.a, time * (o.k === 'mover' ? -4 : 2));
      ctx.fillStyle = col; ctx.fill();
      ctx.beginPath(); ctx.arc(x, y, OS() * 0.32 * sc, 0, TAU); ctx.fillStyle = '#2a0614'; ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // trail
  for (let i = 0; i < trail.length; i++) {
    const k = i / trail.length, [x, y] = trail[i];
    ctx.globalAlpha = k * 0.45; ctx.fillStyle = 'hsl(' + hue + ',100%,75%)';
    ctx.beginPath(); ctx.arc(x, y, PR() * (0.3 + k * 0.7), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // player
  if (state === 'play' || state === 'menu') {
    const [x, y] = pos(P.a, P.f), pr = PR();
    drawGlow('rgba(150,240,255,0.8)', x, y, pr * 3.4);
    const st = 1 + P.sq * 0.35;
    ctx.save(); ctx.translate(x, y); ctx.rotate(P.a);
    ctx.scale(st, 1 / st);
    ctx.beginPath(); ctx.arc(0, 0, pr, 0, TAU); ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.restore();
    // eye looking ahead
    const ea = P.a + Math.PI / 2;
    ctx.beginPath(); ctx.arc(x + Math.cos(ea) * pr * 0.38, y + Math.sin(ea) * pr * 0.38, pr * 0.28, 0, TAU);
    ctx.fillStyle = '#1b1040'; ctx.fill();
  }

  // particles
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.4 + p.life * 0.6), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // floating texts
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const x of texts) {
    const pop = Math.min(1, (1 - x.life) * 8);
    ctx.globalAlpha = Math.min(1, x.life * 2);
    ctx.font = '700 ' + Math.round(x.size * (0.6 + 0.4 * pop)) + 'px Fredoka, system-ui, sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillText(x.txt, x.x + 1.5, x.y + 2);
    ctx.fillStyle = x.color; ctx.fillText(x.txt, x.x, x.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // HUD
  if (state === 'play' || state === 'dying') {
    const top = Math.max(56, cy - RO - 70);
    ctx.save(); ctx.translate(cx, top); ctx.scale(1 + scoreBump * 0.35, 1 + scoreBump * 0.35);
    ctx.font = '700 56px Fredoka, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillText(score, 2, 3);
    ctx.fillStyle = '#fff'; ctx.fillText(score, 0, 0);
    ctx.restore();
    ctx.font = '500 15px Fredoka, system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.fillText('BEST ' + Math.max(best, score), cx, top + 40);
    if (combo >= 2) {
      ctx.font = '700 18px Fredoka, system-ui, sans-serif'; ctx.fillStyle = 'hsl(48,100%,66%)';
      ctx.fillText('spark chain x' + Math.min(combo, 5), cx, cy + RO + 44);
    }
  }
  if (flash > 0.01) { ctx.fillStyle = 'rgba(255,255,255,' + flash + ')'; ctx.fillRect(0, 0, W, H); }
}

// ---------- Loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  last = performance.now();
  if (ac) document.hidden ? ac.suspend() : ac.resume();
});
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
