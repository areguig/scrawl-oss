# Self-hosted Scrawl. Put a reverse proxy with HTTPS in front (Caddy, Traefik, Coolify).
# Set PAD_DOMAIN only when *.your-domain points here with a wildcard certificate; otherwise pads live under /p/<id>.
services:
  scrawl:
    build: .
    restart: unless-stopped
    # Only this machine can reach the port: readers go through the reverse proxy, which also sets the client address.
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      PAD_DOMAIN: ${PAD_DOMAIN:-}
    volumes:
      - scrawl-data:/data

volumes:
  scrawl-data:
