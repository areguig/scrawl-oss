name: pages

on:
  push:
    branches: [main]
    paths: [docs/**, public/home.css, public/favicon.svg, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # The site reuses the scrawls.dev stylesheet and icon instead of keeping copies.
      - run: mkdir _site && cp docs/* _site/ && cp public/home.css public/favicon.svg _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - uses: actions/deploy-pages@v5
        id: deployment
